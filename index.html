<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Web Music Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .player-card { background: #181818; width: 100%; max-width: 450px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; outline: none; background: #282828; color: #fff; }
        .search-box button { background: #1db954; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .poster { width: 100%; height: 280px; border-radius: 12px; object-fit: cover; background: #282828; margin-bottom: 16px; }
        .song-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { color: #b3b3b3; font-size: 0.9rem; margin-bottom: 16px; }
        audio { width: 100%; margin-bottom: 16px; border-radius: 8px; }
        .lyrics-box { background: #282828; border-radius: 10px; padding: 12px; max-height: 120px; overflow-y: auto; font-size: 0.85rem; color: #ccc; line-height: 1.5; white-space: pre-wrap; text-align: left; }
        .results-list { list-style: none; max-height: 150px; overflow-y: auto; margin-bottom: 15px; text-align: left; }
        .results-list li { padding: 8px 12px; background: #242424; margin-bottom: 4px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .results-list li:hover { background: #333; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="search-box">
        <input type="text" id="query" placeholder="Song ya Artist ka naam likho...">
        <button onclick="searchSong()">Search</button>
    </div>

    <ul id="results" class="results-list"></ul>

    <img id="poster" class="poster" src="https://via.placeholder.com/300/282828/FFFFFF?text=Music+Player" alt="Album Art">
    <div id="title" class="song-title">Koi song select karein</div>
    <div id="artist" class="artist-name">-</div>

    <audio id="audio-player" controls autoplay></audio>

    <div class="lyrics-box" id="lyrics">Lyrics yahan dikhenge...</div>
</div>

<script>
    const SAAVN_API = "https://saavn.dev/api/search/songs?query=";
    const LRCLIB_API = "https://lrclib.net/api/get";

    async function searchSong() {
        const query = document.getElementById('query').value.trim();
        if (!query) return;

        const resultsList = document.getElementById('results');
        resultsList.innerHTML = "<li>Searching...</li>";

        try {
            const res = await fetch(SAAVN_API + encodeURIComponent(query));
            const data = await res.json();
            
            resultsList.innerHTML = "";
            if (data.success && data.data.results.length > 0) {
                data.data.results.slice(0, 5).forEach(song => {
                    const li = document.createElement('li');
                    li.innerText = `${song.name} - ${song.primaryArtists}`;
                    li.onclick = () => playSong(song);
                    resultsList.appendChild(li);
                });
            } else {
                resultsList.innerHTML = "<li>Song nahi mila!</li>";
            }
        } catch (err) {
            resultsList.innerHTML = "<li>Error searching song!</li>";
        }
    }

    async function playSong(song) {
        document.getElementById('results').innerHTML = ""; // Clear list
        
        // 1. Title & Artist Set
        document.getElementById('title').innerText = song.name;
        document.getElementById('artist').innerText = song.primaryArtists || song.artists.primary[0].name;

        // 2. High-Res Poster Set
        const imageList = song.image;
        const highResImg = imageList[imageList.length - 1]?.url || imageList[imageList.length - 1]?.link;
        document.getElementById('poster').src = highResImg;

        // 3. Audio Stream Link Set (Highest Quality Available)
        const downloadUrls = song.downloadUrl;
        const streamUrl = downloadUrls[downloadUrls.length - 1]?.url || downloadUrls[downloadUrls.length - 1]?.link;
        
        const player = document.getElementById('audio-player');
        player.src = streamUrl;
        player.play();

        // 4. Fetch Lyrics from LRCLIB API
        fetchLyrics(song.name, song.primaryArtists);
    }

    async function fetchLyrics(track, artist) {
        const lyricsBox = document.getElementById('lyrics');
        lyricsBox.innerText = "Lyrics load ho rahe hain...";

        try {
            const cleanTrack = track.replace(/\\(.*?\\)/g, "").trim();
            const cleanArtist = artist.split(',')[0].trim();
            
            const url = `${LRCLIB_API}?track_name=${encodeURIComponent(cleanTrack)}&artist_name=${encodeURIComponent(cleanArtist)}`;
            const res = await fetch(url);
            
            if (res.ok) {
                const data = await res.json();
                lyricsBox.innerText = data.syncedLyrics || data.plainLyrics || "Lyrics available nahi hain.";
            } else {
                lyricsBox.innerText = "Is song ke lyrics nahi mile.";
            }
        } catch (err) {
            lyricsBox.innerText = "Lyrics fetch karne me dikkat aayi.";
        }
    }
</script>

</body>
</html>
